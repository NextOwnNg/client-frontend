<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#E8F4EF;color:#142D32;font:400 16px/24px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 20px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
.mark{position:relative;width:24px;height:24px}.mark i{position:absolute;width:16px;height:16px;border-radius:4px}
.mark .a{left:0;bottom:0;background:#0B6159}.mark .b{right:0;top:0;background:#F9BB55}
.av{width:36px;height:36px;border-radius:50%;background:#fff}
.page{padding:4px 16px}
.hello{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.02em;padding:0 4px}
.sub{color:#486067;padding:0 4px;margin-top:4px}
.search{margin-top:16px;height:52px;border-radius:24px;background:#fff;display:flex;align-items:center;padding:0 20px;color:#486067}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tile{background:#fff;border-radius:24px;padding:14px 12px;font-weight:600;font-size:15px;line-height:20px}
.tile small{display:block;font-weight:400;font-size:13px;color:#486067;margin-top:4px}
.card{background:#fff;border-radius:24px;margin-top:14px;overflow:hidden}
.ph{height:150px;background:linear-gradient(160deg,#c9cfd1,#8d979b)}
.c{padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.c .t{font-weight:600}.c .m{font-size:14px;color:#486067}
.btn{height:44px;padding:0 18px;border-radius:22px;background:#0B6159;color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center}
.card2{background:#fff;border-radius:24px;margin-top:14px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.th{width:64px;height:64px;border-radius:16px;background:linear-gradient(160deg,#3b4a50,#1c262a)}
.nav{position:fixed;left:12px;right:12px;bottom:12px;height:64px;background:#fff;border-radius:24px;display:flex;justify-content:space-around;align-items:center;font-size:12px;color:#486067;font-weight:500}
.nav .on{color:#0B6159;font-weight:700}
</style></head><body>
<div class="top"><div class="logo"><span class="mark"><i class="a"></i><i class="b"></i></span>NextOwn</div><div class="av"></div></div>
<div class="page">
<div class="hello">Find your next thing.</div>
<div class="sub">Sell it. Swap it. Add cash if you need to.</div>
<div class="search">Search near [Pilot Area]</div>
<div class="tiles"><div class="tile">Sell<small>Get cash</small></div><div class="tile">Swap<small>Trade up</small></div><div class="tile">Quick Sell<small>Ends soon</small></div></div>
<div class="card"><div class="ph"></div><div class="c"><div><div class="t">MacBook Air M1, 2020</div><div class="m">Like new · [Pilot Area]</div></div><span class="btn">₦610,000</span></div></div>
<div class="card2"><div class="th"></div><div><div style="font-weight:600">iPhone 12 Pro · 128GB</div><div style="font-size:14px;color:#486067">Good · Open to swap</div><div style="font-weight:700">₦385,000</div></div></div>
</div>
<div class="nav"><span class="on">Explore</span><span>Feed</span><span>List</span><span>Offers</span><span>Profile</span></div>
</body></html>
