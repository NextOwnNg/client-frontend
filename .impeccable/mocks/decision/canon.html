<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:#fff;color:#142D32;font:400 16px/24px Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:10px;height:64px;padding:0 16px;border-bottom:1px solid #D6E2DE}
.mark{position:relative;width:28px;height:28px;flex:none}.mark i{position:absolute;width:19px;height:19px;border-radius:5px}
.mark .a{left:0;bottom:0;background:#0B6159}.mark .b{right:0;top:0;background:#F9BB55}
.search{flex:1;height:44px;border-radius:10px;background:#F7F9F7;display:flex;align-items:center;padding:0 14px;color:#486067;font-size:15px}
.cats{display:flex;gap:8px;padding:12px 16px;overflow:hidden}
.cat{flex:none;height:34px;padding:0 14px;border-radius:999px;background:#F7F9F7;font-size:14px;display:flex;align-items:center;font-weight:500}
.cat.on{background:#142D32;color:#fff}
.bar{display:flex;justify-content:space-between;padding:0 16px;font-size:14px;color:#486067}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}
.card .ph{height:164px;border-radius:12px}
.p1{background:linear-gradient(160deg,#3b4a50,#1c262a)}.p2{background:linear-gradient(160deg,#c9cfd1,#8d979b)}.p3{background:linear-gradient(160deg,#e5e2da,#b6b1a6)}.p4{background:linear-gradient(160deg,#5c6b70,#2c3639)}
.card .p{font-weight:700;margin-top:6px}.card .t{font-size:14px;line-height:20px}.card .m{font-size:12px;color:#486067}
.nav{position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid #D6E2DE;display:flex;justify-content:space-around;align-items:center;font-size:12px;color:#486067;font-weight:500}
.nav .on{color:#0B6159;font-weight:700}
</style></head><body>
<div class="top"><span class="mark"><i class="a"></i><i class="b"></i></span><div class="search">Search NextOwn</div></div>
<div class="cats"><span class="cat on">All</span><span class="cat">Phones</span><span class="cat">Laptops</span><span class="cat">Gaming</span><span class="cat">Home</span></div>
<div class="bar"><span>[Pilot Area]</span><span>Filter · Recent</span></div>
<div class="grid">
<div class="card"><div class="ph p1"></div><div class="p">₦385,000</div><div class="t">iPhone 12 Pro 128GB</div><div class="m">[Pilot Area] · Good</div></div>
<div class="card"><div class="ph p2"></div><div class="p">₦610,000</div><div class="t">MacBook Air M1 2020</div><div class="m">[Pilot Area] · Like new</div></div>
<div class="card"><div class="ph p3"></div><div class="p">Open to swap</div><div class="t">PS5 Disc Edition</div><div class="m">[Pilot Area] · Fair</div></div>
<div class="card"><div class="ph p4"></div><div class="p">₦245,000</div><div class="t">Galaxy A54 5G</div><div class="m">[Pilot Area] · Good</div></div>
</div>
<div class="nav"><span class="on">Explore</span><span>Feed</span><span>List</span><span>Offers</span><span>Profile</span></div>
</body></html>
