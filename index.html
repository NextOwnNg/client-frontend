<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6159" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Default head tags. React Helmet replaces these per route in the browser;
         the listing share-preview function injects listing tags for scrapers (PRD §4.3). -->
    <title>NextOwn · Turn what you own into what you want</title>
    <meta
      name="description"
      content="Sell what you no longer need, swap for something better, or add cash to make the exchange work."
    />
    <meta property="og:site_name" content="NextOwn" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NextOwn · Find your next thing" />
    <meta
      property="og:description"
      content="Sell what you no longer need, swap for something better, or add cash to make the exchange work."
    />
    <meta property="og:image" content="https://www.nextown.ng/brand/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NextOwn logo with the line: Turn what you own into what you want." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
